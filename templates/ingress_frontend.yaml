apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.frontend.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    {{- toYaml .Values.ingress.frontend.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.frontend.ingressClassName }}
  rules:
    - http:
        paths:
          {{- range .Values.ingress.frontend.rules }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ .serviceName }}
                port:
                  number: {{ .servicePort }}
          {{- end }}